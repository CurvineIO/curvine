# Dependabot configuration.
# Version updates run weekly and are grouped per ecosystem to keep PR volume low.
# Security updates are not limited by these groups.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # curvine-lancedb must use the lance-* release that its `lancedb` version
    # depends on. Separate bumps of single lance crates (#2057, #2059, #2125)
    # mixed releases and broke its build, so these move only together with
    # `lancedb`, by hand.
    ignore:
      - dependency-name: "lance"
      - dependency-name: "lance-*"
      - dependency-name: "lancedb"

  - package-ecosystem: "gomod"
    directory: "/curvine-csi"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/curvine-libsdk/java"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/curvine-web/webui"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
