# Check that every commit in a pull request carries a Developer Certificate
# of Origin sign-off (https://developercertificate.org/, see the DCO file).
# The workflow only reads commit metadata through the API; it never checks
# out or runs code from the PR.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  dco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Signed-off-by trailers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // listCommits caps at 250 commits even when paginated, so a larger PR
            // would otherwise report success with the tail commits never checked.
            const total = context.payload.pull_request.commits;
            if (commits.length !== total) {
              core.setFailed(
                `Read ${commits.length} of ${total} commits: the GitHub API returns at most 250 commits per pull request, ` +
                'so the remaining commits cannot be verified. Split the pull request so every commit can be checked.'
              );
              return;
            }

            const signoff = /^Signed-off-by: (.+) <([^<>]+)>\s*$/gim;
            const failures = [];
            for (const c of commits) {
              const sha = c.sha.slice(0, 8);
              if (c.parents.length > 1) {
                core.info(`${sha}: merge commit, skipped`);
                continue;
              }
              if (c.author && c.author.type === 'Bot') {
                core.info(`${sha}: bot commit, skipped`);
                continue;
              }
              const author = c.commit.author;
              const emails = [...c.commit.message.matchAll(signoff)].map((m) => m[2].toLowerCase());
              if (emails.includes(author.email.toLowerCase())) {
                core.info(`${sha}: signed off by ${author.email}`);
              } else if (emails.length > 0) {
                failures.push(`${sha}: Signed-off-by (${emails.join(', ')}) does not match the author email ${author.email}`);
              } else {
                failures.push(`${sha}: no Signed-off-by trailer`);
              }
            }

            if (failures.length > 0) {
              core.setFailed([
                'Some commits are missing a DCO sign-off:',
                ...failures.map((f) => `  - ${f}`),
                '',
                'Sign off by committing with `git commit -s`. To fix existing commits on your branch:',
                '  git rebase --signoff origin/main',
                '  git push --force-with-lease',
                'See the "Sign Your Commits" section of CONTRIBUTING.md.',
              ].join('\n'));
            } else {
              core.info(`All ${commits.length} commits are signed off.`);
            }
