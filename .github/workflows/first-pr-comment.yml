# Leave a one-time comment on the first pull request a contributor opens.
#
# pull_request_target is needed so the token can comment on PRs from forks.
# This workflow never checks out or runs code from the PR, and does not
# interpolate any PR-controlled text into a script.
name: First PR Comment

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER", "NONE"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the contributor's first PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // author_association stays FIRST_TIME_CONTRIBUTOR until a PR is merged,
            // so skip authors who already opened an earlier PR here.
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr author:${author}`,
              per_page: 100,
            });
            if (data.items.some((item) => item.number < pr.number)) {
              core.info(`${author} has opened a PR before; skipping.`);
              return;
            }

            const body = "If you like this project, please give it a star so it\u2019s easier for you to get involved later. Thank you.";

            // A re-run of this workflow must not post the invitation twice.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            if (comments.some((c) => c.user?.login === "github-actions[bot]" && c.body === body)) {
              core.info(`Invitation already posted on #${pr.number}; skipping.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
