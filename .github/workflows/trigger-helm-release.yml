name: Trigger Helm Release

# Dispatches the CurvineIO/curvine-helm chart release after all release
# artifacts (images, binaries, SDK JARs) are verified by the release.yml
# orchestrator. Also runnable standalone via workflow_dispatch as a rescue
# path (e.g. re-dispatch after a failed helm sync).

on:
  # Called by release.yml as a reusable workflow.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to sync to curvine-helm (e.g. v0.3.0)'
        required: true
        type: string
      commit_sha:
        description: 'Curvine commit SHA for the release (optional)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync to curvine-helm (e.g. v0.3.0)'
        required: true
        type: string
      commit_sha:
        description: 'Curvine commit SHA for the release (optional)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: trigger-helm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  trigger-helm-release:
    name: Dispatch helm release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Release tag must start with v, got: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Source commit: $SHA"

      - name: Validate release tag vs Cargo version
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 1

      - name: Check release tag consistency
        run: |
          bash build/validate-release-version.sh "${{ steps.meta.outputs.tag }}"
          echo "Release tag ${{ steps.meta.outputs.tag }} matches Cargo workspace version"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release images in GHCR
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"

          for image in ghcr.io/curvineio/curvine ghcr.io/curvineio/curvine-csi; do
            echo "Inspecting ${image}:${TAG}"
            docker buildx imagetools inspect "${image}:${TAG}"
          done

      - name: Dispatch curvine-helm release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CURVINE_HELM_DISPATCH_TOKEN }}
          repository: CurvineIO/curvine-helm
          event-type: curvine-release
          client-payload: >-
            {
              "tag": "${{ steps.meta.outputs.tag }}",
              "sha": "${{ steps.meta.outputs.sha }}",
              "repository": "${{ github.repository }}"
            }

      - name: Dispatch summary
        run: |
          {
            echo "## Helm Release Dispatch"
            echo "- **Tag**: ${{ steps.meta.outputs.tag }}"
            echo "- **Source commit**: ${{ steps.meta.outputs.sha }}"
            echo "- **Target repository**: CurvineIO/curvine-helm"
            echo "- **Event**: curvine-release"
          } >> "$GITHUB_STEP_SUMMARY"
