# Pure-Java unit tests for the Java SDK. They need no native library, Rust build,
# or running cluster, so they run on every PR that touches the Java SDK.
name: Java SDK Unit Test

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'curvine-libsdk/java/**'
      - 'crates/common/curvine-proto/proto/**'
      - '.github/workflows/java-sdk-unit-test.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'curvine-libsdk/java/**'
      - 'crates/common/curvine-proto/proto/**'
      - '.github/workflows/java-sdk-unit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    # A test class belongs in PURE_JAVA_TESTS only if it is pure Java: it never loads
    # the native library (no CurvineNative calls, no System.loadLibrary) and needs no
    # running cluster, so it passes on a plain JDK with no Rust build. Add new classes
    # that meet this rule here. Classes that need JNI or a cluster (for example
    # LibFsTest, CurvineFileSystemTest, BenchTest, ShellTest) must stay out.
    env:
      PURE_JAVA_TESTS: >-
        CurvineFileSystemLifecycleTest,
        CurvineFileSystemMkdirsTest,
        CurvineFileSystemMountCacheKeyTest,
        CurvineFileSystemRenameTest,
        CurvineFileSystemToHadoopTest,
        CurvineFileSystemAppendTest,
        CurvineFsStatTest,
        CurvineJavaUtilsTest,
        CurvineMountClientTest,
        CurvineNativeLibraryResolverTest,
        FreeResultTest,
        MountRequestTest,
        SetAttrOptsTest,
        TransferClientTest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Surefire skips a -Dtest name that matches no class and only fails when none
      # match, so a renamed or deleted class would silently stop running. Fail here instead.
      - name: Check every listed test class exists
        working-directory: curvine-libsdk/java
        run: |
          missing=0
          for cls in ${PURE_JAVA_TESTS//,/ }; do
            f="src/test/java/io/curvine/$cls.java"
            if [ ! -f "$f" ]; then
              echo "::error::$cls is listed in PURE_JAVA_TESTS but $f does not exist"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up JDK 8
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run unit tests
        working-directory: curvine-libsdk/java
        run: mvn -B protobuf:compile test -Dtest="$PURE_JAVA_TESTS"
