[package]
name = "curvine-storage-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Curvine local worker storage adapter."

[features]
default = []
spdk = ["dep:curvine-storage-spdk", "curvine-storage-spdk/spdk"]
spdk-rdma = ["spdk", "curvine-storage-spdk/spdk-rdma"]
# Exposes synthetic (no real bdev) SPDK dataset constructors for other
# crates' unit tests. Never enabled in default/release builds.
test-util = []
# Opt-in Linux staged-write timings; ordinary test-util benchmarks omit the probes.
write-bench-profile = []

[dependencies]
curvine-core-error = { workspace = true }
curvine-runtime = { workspace = true }
curvine-io = { workspace = true }
curvine-sys = { workspace = true }
curvine-model = { workspace = true }
curvine-config = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-storage-spdk = { workspace = true, optional = true }
bytes = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
indexmap = { workspace = true }
byteorder = { workspace = true }
crc32c = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
compio-buf = { version = "0.8.2", features = ["bytes"] }
compio-driver = { version = "0.12.0", default-features = false, features = [
    "io-uring",
] }
compio-runtime = "0.12.0"
futures = { workspace = true }
io-uring = "0.7"
tempfile = { workspace = true }
tokio = { workspace = true }
