[package]
name = "curvine-profiling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opt-in process-level CPU profiling (flame graph) for Curvine services."

[dependencies]
curvine-config = { workspace = true }
log = { workspace = true }

[target.'cfg(unix)'.dependencies]
pprof = { workspace = true, features = ["flamegraph"], optional = true }

[features]
# Compiles the SIGPROF sampler. Without it this crate only exposes the
# configuration gate, so default builds carry no profiling dependency.
profiling = ["dep:pprof"]
