[package]
name = "curvine-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curvine RPC primitives."

[dependencies]
curvine-io = { workspace = true }
curvine-sys = { workspace = true }
curvine-core-error = { workspace = true }
curvine-net = { workspace = true }
curvine-runtime = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
prost = { workspace = true }
num_enum = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
tonic = { version = "0.9", default-features = false, features = ["codegen", "prost"] }
tonic-health = { version = "0.9", optional = true }
tonic-reflection = { version = "0.9", optional = true }

[dev-dependencies]
curvine-proto = { workspace = true }
futures = { workspace = true }

[features]
default = []
transport = ["tonic/transport", "tonic/tls", "dep:tonic-health", "dep:tonic-reflection"]

[[test]]
name = "grpc_tls"
required-features = ["transport"]
