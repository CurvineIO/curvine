[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "../../../curvine-libsdk/python"
module-name = "curvine_libsdk._native"
features = ["extension-module"]
# include = [{ path = "src/python/**", format = "sdist"}]

[project]
name = "curvine_libsdk"
# Version is inherited from the Cargo workspace ([workspace.package].version)
# via maturin's dynamic version support, so the wheel always matches the
# component release version instead of drifting from it.
dynamic = ["version"]
requires-python = ">=3.6"
dependencies = [
    "protobuf>=3.19,<6",
    "fsspec",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
