syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "LoadProto";

import "common.proto";
import "transfer.proto";

// The messages below belong to the worker task protocol the transfer service
// still speaks: workers accept task commands and report per-task progress over
// it. Client-facing job submit/status shapes live in transfer.proto.
//
// Cancel the job request
message CancelJobRequest {
  required string job_id = 1;
}

// Cancel the job response
message CancelJobResponse {
}

// Worker task submission, still used by the transfer service.
message SubmitTaskRequest {
  required TransferKindProto task_type = 1;
  required bytes task_command = 2;
}

message SubmitTaskResponse {
  required string task_id = 1;
  optional bool accepted = 2 [default = true];
  optional string reject_reason = 3 [default = ""];
  // The rejection is backpressure, not a verdict on the task: the worker is out
  // of queue room right now and will accept the same task once room appears.
  optional bool retryable = 4 [default = false];
}
