[package]
name = "curvine-data-mover"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curvine data movement helpers and orchestration clients."

[features]
default = []
opendal = ["curvine-unified-fs/opendal"]
opendal-s3 = ["curvine-unified-fs/opendal-s3"]
opendal-oss = ["curvine-unified-fs/opendal-oss"]
opendal-gcs = ["curvine-unified-fs/opendal-gcs"]
