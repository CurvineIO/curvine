[package]
name = "curvine-master"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# CPU flame-graph sampling: compiles the SIGPROF sampler and mounts its route.
profiling = ["curvine-profiling/profiling", "curvine-web/profiling"]
memory-profiling = ["profiling", "curvine-profiling/memory-profiling", "curvine-web/memory-profiling"]
fault-injection = ["curvine-fault/http-server"]

[dependencies]
curvine-core-error = { workspace = true }
curvine-rpc = { workspace = true }
curvine-net = { workspace = true }
curvine-raft = { workspace = true }
curvine-proto = { workspace = true }
curvine-fs-api = { workspace = true }
curvine-config = { workspace = true }
curvine-profiling = { workspace = true }
curvine-sys = { workspace = true }
curvine-alloc = { workspace = true }
curvine-model = { workspace = true }
curvine-record = { workspace = true }
curvine-runtime = { workspace = true }
curvine-metrics = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-codec = { workspace = true }
curvine-data-transfer = { workspace = true, features = ["opendal-s3"] }
curvine-job-client = { workspace = true }
curvine-unified-fs = { workspace = true }
curvine-ufs-api = { workspace = true }
curvine-web = { workspace = true }
curvine-fault = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
raft = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
futures = { workspace = true }
num_enum = { workspace = true }
indexmap = { workspace = true }
mini-moka = { workspace = true }
dashmap = { workspace = true }
roaring = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
