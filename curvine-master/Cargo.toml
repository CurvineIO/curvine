[package]
name = "curvine-master"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
fault-injection = ["curvine-fault/http-server"]

[dependencies]
orpc = { workspace = true }
curvine-common = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-client = { workspace = true, features = ["job-client", "unified", "opendal-s3"] }
curvine-web = { workspace = true }
curvine-fault = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
raft = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
futures = { workspace = true }
num_enum = { workspace = true }
indexmap = { workspace = true }
mini-moka = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
thiserror = { workspace = true }
