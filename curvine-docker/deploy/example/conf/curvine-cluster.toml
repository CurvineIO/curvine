
format_master = false
format_worker = false
cluster_id = "curvine"

# Network interface (e.g. "eth0") used to auto-resolve this node's local IPv4.
# When set (non-empty), on startup the resolved IPv4 is applied to the
# master/mds/journal/worker/client hostnames, and the CURVINE_*_HOSTNAME env vars
# are ignored. When empty (the default), hostnames come from the config below
# and may be overridden by the CURVINE_*_HOSTNAME env vars.
#
# Multi-node note: this only fills THIS node's own hostname. The cluster
# membership lists (journal.journal_addrs and client.master_addrs) must still
# be written out explicitly, and each node's entry must use the exact IPv4 that
# its interface resolves to -- otherwise the node cannot locate itself in the
# raft group and startup fails with a clear error.
# net_interface = "eth0"

# Service discovery is disabled by default. When enabled, the first provider is
# etcd over internal cluster networking; auth/TLS settings are intentionally not
# part of the first phase.
[discovery]
enabled = false
provider = "etcd"
# Set when enabled, for example: ["http://etcd-0:2379", "http://etcd-1:2379"]
endpoints = []
# Etcd key prefix. Effective keys are {prefix}/{cluster_id}/services/{kind}/{service_id}.
prefix = "/curvine"
connect_timeout_ms = 3000
request_timeout_ms = 3000
# Watch reconnect uses exponential backoff between min/max with this jitter ratio.
watch_reconnect_min_ms = 1000
watch_reconnect_max_ms = 30000
watch_reconnect_jitter_ratio = 0.2
# If false, resolver snapshot() returns StaleCache while watch is disconnected.
allow_stale_cache = true

[master]
rpc_port = 8995
web_port = 9000
meta_dir = "./data/meta"
audit_logging_enabled = true
log = { level = "info", log_dir = "./logs", file_name = "master.log" }

# Optional standalone stateless metadata service. It is disabled by default;
# start it with `curvine-server --service mds` only after enabling this flag.
[mds]
enabled = false
rpc_port = 8998
web_port = 9004
log = { level = "info", log_dir = "./logs", file_name = "mds.log" }

[journal]
rpc_port = 8996
journal_addrs = [
    {id = 1, hostname = "cv-master-0.svc.cluster.local", port = 8996},
    {id = 2, hostname = "cv-master-1.svc.cluster.local", port = 8996},
    {id = 3, hostname = "cv-master-2.svc.cluster.local", port = 8996}
]
journal_dir = "./data/journal"

[worker]
rpc_port = 8997
web_port = 9000
dir_reserved = "10GB"
# Disk free-space ratio floor. When a data dir's free ratio drops below this
# value, the dir stops accepting new writes (worker rejects blocks and the
# master stops allocating to it). 0.0 disables (default). Range [0.0, 1.0).
# Example: 0.1 = stop writing when free < 10%. Scales with disk size, unlike
# the fixed-byte dir_reserved; reacts to other apps sharing the device.
# free_ratio = 0.1
data_dir = [
    "[SSD]/data/data1",
]
log = { level = "info", log_dir = "./logs", file_name = "worker.log" }


[client]
master_addrs = [
    { hostname = "cv-master-0.svc.cluster.local", port = 8995 },
    { hostname = "cv-master-1.svc.cluster.local", port = 8995 },
    { hostname = "cv-master-2.svc.cluster.local", port = 8995 }
]

[transfer]
# Run `curvine-server transfer` as an independent service. These ports and this
# log file belong to Transfer; they are intentionally separate from Master.
enabled = false
rpc_port = 9010
web_port = 9011
client_pending_queue_size = 1024
client_submit_concurrency = 64
log = { level = "info", log_dir = "./logs", file_name = "transfer.log" }

[fuse]
debug = false
# Kernel-side metadata cache timeouts (milliseconds).
# BREAKING: the old second-based keys attr_timeout / entry_timeout /
# negative_timeout were renamed to *_ms (value x1000) and are now ignored.
attr_timeout_ms = 1000
entry_timeout_ms = 1000
negative_timeout_ms = 0

[log]
level = "info"
log_dir = "./logs"
file_name = "client.log"
