apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cv-master
  labels:
    role: cv-master
  namespace: curvine
spec:
  selector:
    matchLabels:
      role: cv-master
  serviceName: "cv-master"
  podManagementPolicy: "Parallel"
  # Roll one master at a time. Before a rolling update, set partition to
  # replicas-1 and decrease it only after that pod accepts TCP 8996 and
  # /rolloutz is 200. journal_addrs in the example config are pod DNS names,
  # not Ready Service endpoints.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      partition: 0
  replicas: 3
  template:
    metadata:
      labels:
        role: cv-master
    spec:
      setHostnameAsFQDN: true
      nodeSelector:
        karpenter.k8s.aws/instance-family: m5
        karpenter.k8s.aws/instance-size: 2xlarge
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: bigdata/role
                  operator: In
                  values:
                  - cv-master
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                  - ap-southeast
      containers:
        - name: cv-master
          image: docker.io/curvine:latest
          imagePullPolicy: IfNotPresent
          args:
            - master
          readinessProbe:
            httpGet:
              path: /rolloutz
              port: 9010
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # TCP 8996 is process and Raft liveness. Role publication, metadata
          # catch-up, and UFS replay must not kill the pod. /rolloutz stays
          # 503 until a follower has a known role, or a leader has finished
          # UFS replay, which holds the next StatefulSet pod.
          startupProbe:
            tcpSocket:
              port: 8996
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 180
          livenessProbe:
            tcpSocket:
              port: 8996
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          ports:
            - containerPort: 8995
            - containerPort: 8996
            - containerPort: 9010
          volumeMounts:
          - name: curvine-conf
            mountPath: /app/curvine/conf
      volumes:
        - name: curvine-conf
          configMap:
            name: curvine-conf
      restartPolicy: Always
