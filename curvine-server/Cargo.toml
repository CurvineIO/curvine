[package]
name = "curvine-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
jni = ["curvine-client/opendal-hdfs"]
spdk = [
    "curvine-worker/spdk",
]
spdk-rdma = [
    "spdk",
    "curvine-worker/spdk-rdma",
]
fault-injection = [
    "curvine-fault/http-server",
    "curvine-master/fault-injection",
    "curvine-worker/fault-injection",
]

[dependencies]
orpc = { workspace = true }
curvine-common = { workspace = true }
curvine-master = { workspace = true }
curvine-worker = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-fault = { workspace = true }
curvine-client = { workspace = true, features = ["job-client", "unified", "opendal-s3"] }
curvine-ufs-api = { workspace = true }
curvine-web = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
crossbeam = { workspace = true }
rusqlite = { workspace = true }
mysql = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
curvine-rocksdb = { workspace = true }
curvine-fault = { workspace = true, features = ["http-client"] }
raft = { workspace = true }
