[package]
name = "curvine-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
jni = ["curvine-master/jni", "curvine-worker/jni"]
spdk = ["curvine-worker/spdk"]
spdk-rdma = ["curvine-worker/spdk-rdma"]
fault-injection = [
    "curvine-master/fault-injection",
    "curvine-worker/fault-injection",
]
transfer-store-tests = []

[dependencies]
orpc-rpc = { workspace = true }
curvine-client-core = { workspace = true }
curvine-common-core = { workspace = true }
curvine-data-mover = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-fault = { workspace = true }
curvine-master = { workspace = true }
curvine-raft = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-worker = { workspace = true }
curvine-ufs-api = { workspace = true }
curvine-web = { workspace = true }
prost = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
rocksdb = { workspace = true }
log = { workspace = true }
raft = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
num_enum = { workspace = true }
indexmap = { workspace = true }
clap = { workspace = true }
mini-moka = { workspace = true }
regex = { workspace = true }
linked-hash-map = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
byteorder = { workspace = true }

[dev-dependencies]
curvine-fault = { workspace = true, features = ["http-client"] }

[[test]]
name = "transfer_store_test"
path = "tests/transfer_store_test.rs"
required-features = ["transfer-store-tests"]
