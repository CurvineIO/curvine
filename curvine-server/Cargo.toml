[package]
name = "curvine-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
jni = ["curvine-data-transfer/opendal-hdfs"]
spdk = [
    "curvine-worker/spdk",
    "curvine-storage-local/spdk",
]
spdk-rdma = [
    "spdk",
    "curvine-worker/spdk-rdma",
    "curvine-storage-local/spdk-rdma",
]
fault-injection = [
    "curvine-fault/http-server",
    "curvine-master/fault-injection",
    "curvine-worker/fault-injection",
]

[dependencies]
curvine-proto = { workspace = true }
curvine-fs-api = { workspace = true }
curvine-config = { workspace = true }
orpc = { workspace = true }
curvine-sys = { workspace = true }
curvine-alloc = { workspace = true }
curvine-model = { workspace = true }
curvine-runtime = { workspace = true }
curvine-master = { workspace = true }
curvine-worker = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-fault = { workspace = true }
curvine-client-core = { workspace = true }
curvine-data-transfer = { workspace = true, features = ["opendal-s3", "transfer-server"] }
curvine-storage-local = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-raft = { workspace = true }
curvine-job-client = { workspace = true }
curvine-ufs-api = { workspace = true }
curvine-web = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
crossbeam = { workspace = true }
rusqlite = { workspace = true }
mysql = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
curvine-fault = { workspace = true, features = ["http-client"] }
raft = { workspace = true }
