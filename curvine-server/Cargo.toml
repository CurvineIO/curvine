[package]
name = "curvine-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
jni = ["curvine-client/opendal-hdfs"]
spdk = [
    "dep:curvine-storage-spdk",
    "curvine-storage-spdk/spdk",
    "curvine-storage-local/spdk",
]
spdk-rdma = [
    "spdk",
    "curvine-storage-spdk/spdk-rdma",
    "curvine-storage-local/spdk-rdma",
]
fault-injection = [
    "curvine-fault/http-server",
]

[dependencies]
orpc = { workspace = true }
curvine-common = { workspace = true }
curvine-rocksdb = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-fault = { workspace = true }
curvine-storage-local = { workspace = true }
curvine-storage-spdk = { workspace = true, optional = true }
curvine-client = { workspace = true, features = ["job-client", "unified", "opendal-s3"] }
curvine-ufs-api = { workspace = true }
curvine-web = { workspace = true }
prost = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
raft = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
num_enum = { workspace = true }
indexmap = { workspace = true }
clap = { workspace = true }
mini-moka = { workspace = true }
regex = { workspace = true }
linked-hash-map = { workspace = true }
crossbeam = { workspace = true }
rusqlite = { workspace = true }
mysql = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
byteorder = { workspace = true }

[dev-dependencies]
curvine-fault = { workspace = true, features = ["http-client"] }
