[package]
name = "curvine-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
spdk = [
    "dep:curvine-storage-spdk",
    "curvine-storage-spdk/spdk",
    "curvine-storage-local/spdk",
]
spdk-rdma = [
    "spdk",
    "curvine-storage-spdk/spdk-rdma",
    "curvine-storage-local/spdk-rdma",
]
fault-injection = [
    "curvine-fault/http-server",
]

[dependencies]
curvine-core-error = { workspace = true }
curvine-rpc = { workspace = true }
curvine-net = { workspace = true }
curvine-io = { workspace = true }
curvine-proto = { workspace = true }
curvine-fs-api = { workspace = true }
curvine-config = { workspace = true }
curvine-sys = { workspace = true }
curvine-alloc = { workspace = true }
curvine-model = { workspace = true }
curvine-runtime = { workspace = true }
curvine-error = { workspace = true, features = ["axum-response"] }
curvine-metrics = { workspace = true }
curvine-client-core = { workspace = true }
curvine-data-transfer = { workspace = true, features = ["opendal-s3"] }
curvine-web = { workspace = true }
curvine-fault = { workspace = true }
curvine-storage-local = { workspace = true }
curvine-storage-spdk = { workspace = true, optional = true }
log = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
