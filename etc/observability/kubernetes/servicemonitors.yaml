# Example for Prometheus Operator installations that expose Curvine metrics
# through named Service ports. Adjust namespace and release labels as needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: curvine-master
  namespace: curvine
  labels:
    app.kubernetes.io/name: curvine
spec:
  namespaceSelector:
    matchNames: [curvine]
  selector:
    matchLabels:
      app.kubernetes.io/name: curvine
      app.kubernetes.io/component: master
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          targetLabel: component
          replacement: master
---
