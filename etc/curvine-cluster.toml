
# Whether to format it.
# master formatting will delete rocksdb metadata
# Worker formatting will delete the data directory.
format_master = false
format_worker = false

# Network interface (e.g. "eth0") used to auto-resolve this node's local IPv4.
# When set (non-empty), on startup the resolved IPv4 is applied to the
# master/mds/journal/worker/client hostnames, and the CURVINE_*_HOSTNAME env vars
# are ignored. When empty (the default), hostnames come from the config below
# and may be overridden by the CURVINE_*_HOSTNAME env vars.
#
# Multi-node note: this only fills THIS node's own hostname. The cluster
# membership lists (journal.journal_addrs and client.master_addrs) must still
# be written out explicitly, and each node's entry must use the exact IPv4 that
# its interface resolves to -- otherwise the node cannot locate itself in the
# raft group and startup fails with a clear error.
# net_interface = "eth0"

# Test-only remote fault control. Exposing the HTTP API requires BOTH:
#   1) enabled = true below, and
#   2) binaries built with `--features fault-injection`
#      (e.g. curvine-server/fault-injection).
# Enabling this without rebuilding fails server startup instead of silently
# omitting the requested route.
# Keep disabled in normal runs.
[fault_injection]
enabled = false
auth_token_env = "CURVINE_FAULT_TOKEN"

# Service discovery is disabled by default. When enabled, the first provider is
# etcd over internal cluster networking; auth/TLS settings are intentionally not
# part of the first phase.
[discovery]
enabled = false
provider = "etcd"
# Set when enabled, for example: ["http://etcd-0:2379", "http://etcd-1:2379"]
endpoints = []
# Etcd key prefix. Effective keys are {prefix}/{cluster_id}/services/{kind}/{service_id}.
prefix = "/curvine"
connect_timeout_ms = 3000
request_timeout_ms = 3000
# Watch reconnect uses exponential backoff between min/max with this jitter ratio.
watch_reconnect_min_ms = 1000
watch_reconnect_max_ms = 30000
watch_reconnect_jitter_ratio = 0.2
# If false, resolver snapshot() returns StaleCache while watch is disconnected.
allow_stale_cache = true


# master configuration
[master]
meta_dir = "testing/meta"
# Worker selection policy: local, robin, random, load_based, or weighted.
# local prefers a local worker for the first replica and assigns the rest via the weighted policy.
# worker_policy = "weighted"
log = { level = "info", log_dir = "stdout", file_name = "master.log" }

# Version compatibility policy.
# mode: "diagnose" (default, allow with warnings) or "enforce" (reject
# incompatible workers/clients). Bounds below are empty by default, meaning
# old components are never rejected without explicit configuration.
#
# NOTE: enforce mode requires workers that report component_info on their
# heartbeat (available since #1584). Workers built before #1584 do not send
# component_info, so every heartbeat resolves to MissingInfo and enforce mode
# rejects them - the cluster cannot form. Keep diagnose until the whole
# worker fleet is upgraded.
# [master.compatibility]
# mode = "diagnose"
# min_worker_version = "0.1.0"
# min_client_version = "0.1.0"
# blocked_versions = ["0.2.5"]

# Optional standalone stateless metadata service. Disabled by default; start it
# with `curvine-server --service mds` after enabling this flag.
[mds]
enabled = false
rpc_port = 8998
web_port = 9004
# KV storage backend. Supported values: "fdb" and "memory".
# Use "fdb" for production deployments; "memory" is only intended for tests
# and loses all metadata when the MDS process exits.
kv_backend = "fdb"
# Path to the FoundationDB cluster file (the same file `fdbcli -C <path>`
# accepts). Required when kv_backend = "fdb".
fdb_cluster_file = "/etc/foundationdb/fdb.cluster"
log = { level = "info", log_dir = "stdout", file_name = "mds.log" }


# masta ha raft configuration.
[journal]
journal_addrs = [
    {id = 1, hostname = "localhost", port = 8996}
]
journal_dir = "testing/journal"


# Worker configuration
[worker]
# Relative allocation weight used when master.worker_policy = "weighted".
# Set higher values on more capable nodes; 0 disables new allocations to this worker.
# This is trusted administrator configuration and is not capped by the master.
weight = 1
dir_reserved = "0"
data_dir = [
    "[DISK]testing/data",
]
log = { level = "info", log_dir = "stdout", file_name = "worker.log" }

# SPDK over NVMe-oF/RDMA configuration  
[worker.spdk_disk]  
enabled = false  
app_name = "curvine"  
reactor_mask = "0x3"  
# Max time to wait for an idle NVMe qpair under qpair exhaustion (default "30s").  
# qpair_acquire_timeout = "30s"  


# NVMe-oF targets  
[[worker.spdk_disk.targets]]  
trtype = "rdma"  
adrfam = "ipv4"  
traddr = "192.168.1.100"  
trsvcid = 4420  
subnqn = "nqn.2024-01.io.curvine:subsystem1"  
[[worker.spdk_disk.targets]]  
trtype = "rdma"  
adrfam = "ipv4"  
traddr = "192.168.1.101"  
trsvcid = 4420  
subnqn = "nqn.2024-01.io.curvine:subsystem2"

# Customer service configuration.
[client]

[transfer]
# Set to true to start the standalone Transfer service. Local SQLite storage,
# replica metadata reader and localhost:9010 are inferred by default. Transfer
# uses its own RPC/Web ports and log file; it does not reuse Master settings.
# Production stores use store_url. TLS validates the system trust store; add
# sslrootcert for a PostgreSQL server signed by a private CA:
# store_url = "postgresql://user:password@postgres-host:5432/curvine_transfer?sslmode=require"
# store_url = "postgresql://user:password@postgres-host:5432/curvine_transfer?sslmode=require&sslrootcert=/etc/curvine/postgres-ca.pem"
enabled = false
rpc_port = 9010
web_port = 9011
# Maximum distinct auto-cache requests waiting for client-side submission.
# When full, new cache requests are skipped and foreground reads continue from UFS.
client_pending_queue_size = 1024
client_submit_concurrency = 64
log = { level = "info", log_dir = "stdout", file_name = "transfer.log" }

# fuse configuration
[fuse]
# Kernel-side metadata cache timeouts (milliseconds).
# NOTE: renamed in a breaking change — the old second-based f64 keys
# (attr_timeout / entry_timeout / negative_timeout) are no longer recognized
# and are silently ignored. Migrate by switching to the *_ms keys below and
# multiplying the old value by 1000.
attr_timeout_ms = 1000       # kernel attribute cache; 0 disables it
entry_timeout_ms = 1000      # kernel dentry (name lookup) cache; 0 disables it
negative_timeout_ms = 0      # negative-lookup (ENOENT) cache; 0 = disabled

# The log configuration of the customer service side, and the customer service side of rust, java, and fuse use this log file.
[log]
level = "info"
log_dir = "stdout"
file_name = "curvine.log"

[cli]
log = { level = "warn", log_dir = "stdout", file_name = "cli.log" }
