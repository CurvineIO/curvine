
# Whether to format it.
# master formatting will delete rocksdb metadata
# Worker formatting will delete the data directory.
format_master = false
format_worker = false

# Operator visible alias of this cluster, exported as the `cluster_name` metric
# label. It is cosmetic only: no storage path, worker registration check or
# discovery key reads it, so it can be renamed at any time without touching the
# cluster identity. Can also be set with the CURVINE_CLUSTER_NAME env var. When
# unset, the label falls back to cluster_id, so uncommenting is only needed to
# give this cluster its own name in Prometheus.
# cluster_name = "curvine-prod"

# Network interface (e.g. "eth0") used to auto-resolve this node's local IPv4.
# When set (non-empty), on startup the resolved IPv4 is applied to the
# master/mds/journal/worker/client hostnames, and the CURVINE_*_HOSTNAME env vars
# are ignored. When empty (the default), hostnames come from the config below
# and may be overridden by the CURVINE_*_HOSTNAME env vars.
#
# Multi-node note: this only fills THIS node's own hostname. The cluster
# membership lists (journal.journal_addrs and client.master_addrs) must still
# be written out explicitly, and each node's entry must use the exact IPv4 that
# its interface resolves to -- otherwise the node cannot locate itself in the
# raft group and startup fails with a clear error.
# net_interface = "eth0"

# Test-only remote fault control. Exposing the HTTP API requires BOTH:
#   1) enabled = true below, and
#   2) binaries built with `--features fault-injection`
#      (e.g. curvine-server/fault-injection).
# Enabling this without rebuilding fails server startup instead of silently
# omitting the requested route.
# Keep disabled in normal runs.
[fault_injection]
enabled = false
auth_token_env = "CURVINE_FAULT_TOKEN"

# Process-level CPU flame graph (GET /api/v1/profiling/cpu).
#
# Two gates, both off by default:
#   1. build with `--features profiling` so the SIGPROF sampler is compiled
#   2. set cpu_enabled = true below
# Enabling cpu_enabled on a build without the feature is rejected at startup.
# Sampling costs CPU and must never be switched on implicitly.
[profiling]
cpu_enabled = false
cpu_frequency = 1000        # Hz, 1..=1000
max_duration_secs = 120     # longest accepted window; larger requests are clamped
blocklist = ["libc", "libgcc", "pthread", "vdso"]  # libunwind is not signal-safe

# Service discovery is disabled by default. When enabled, the first provider is
# etcd over internal cluster networking; auth/TLS settings are intentionally not
# part of the first phase.
[discovery]
enabled = false
provider = "etcd"
# Set when enabled, for example: ["http://etcd-0:2379", "http://etcd-1:2379"]
endpoints = []
# Etcd key prefix. Effective keys are {prefix}/{cluster_id}/services/{kind}/{service_id}.
prefix = "/curvine"
connect_timeout_ms = 3000
request_timeout_ms = 3000
# Watch reconnect uses exponential backoff between min/max with this jitter ratio.
watch_reconnect_min_ms = 1000
watch_reconnect_max_ms = 30000
watch_reconnect_jitter_ratio = 0.2
# If false, resolver snapshot() returns StaleCache while watch is disconnected.
allow_stale_cache = true


# master configuration
[master]
# Master process `/metrics` listener.
web_port = 9010
meta_dir = "testing/meta"
# Worker selection policy: local, robin, random, load_based, or weighted.
# local prefers a local worker for the first replica and assigns the rest via the weighted policy.
# worker_policy = "weighted"

# Recycle bin. While enabled, deletes on Curvine-native paths move entries to
# /.Trash instead of freeing blocks immediately. Mounted paths (cache_mode /
# fs_mode) always bypass the bin, because the client removes the UFS object
# first and a trash entry could never be restored. The /.Trash namespace is
# reserved even while disabled.
# trash_retention: how long entries stay in the bin before the master purges
#   them; "0" disables automatic purging.
# trash_check_interval: how often the master scans /.Trash for expired entries.
# trash_purge_batch_inodes: inodes a single purge batch removes before the master
#   releases the namespace lock again (default 4096).
# trash_purge_yield_ms: milliseconds the purger yields between batches so
#   foreground metadata operations are not starved (default 5).
# trash_purge_interval: how often the master drains /.Trash/.pending, i.e. the
#   entries staged by async deletes; runs even while trash_enabled is false.
# trash_enabled = false
# trash_retention = "7d"
# trash_check_interval = "1h"
# trash_purge_batch_inodes = 4096
# trash_purge_yield_ms = 5
# trash_purge_interval = "1s"
# Log rotation applies when log_dir is a directory; stdout and stderr are not rotated.
# max_file_size_mb: rotate when the file reaches this size in MB (default 100, 0 = no size limit).
# time_rotation: "daily" or "hourly" (default none). Combined with max_file_size_mb, whichever
#   fires first rotates the file.
# With both options unset, files rotate by size only, at 100 MB. If max_file_size_mb = 0 and no
#   valid time_rotation is set, files rotate daily so they cannot grow without limit.
# max_log_files: number of rotated files to keep (default 10).
# Example: log = { level = "info", log_dir = "logs", file_name = "master.log", max_file_size_mb = 200, time_rotation = "daily", max_log_files = 20 }
log = { level = "info", log_dir = "logs", file_name = "master.log" }

# Dir-space periodic directory usage snapshots for `curvine fs du` / `count`.
# Disabled by default; enable only after validating scan RSS, duration and
# metadata RPC P99 on your target hardware (see docs/design/dir-space.md §13).
[master.dir_space]
enabled = false
# Global full-namespace scan cadence and cooperative deadline (timeout must be
# <= interval). Scans run only on the active master and never publish partial
# results on timeout, limit or role loss.
global_scan_interval = "10m"
global_scan_timeout = "5m"
# Tracked mount/config path scans (same timeout <= interval rule).
tracked_scan_interval = "2m"
tracked_scan_timeout = "90s"
# Hard caps for one global scan round (inodes/edges/dirs/depth/memory/record size).
max_inodes = 5000000
max_edges = 10000000
max_dirs = 1000000
max_depth = 1024
memory_budget = "768MB"
max_inode_record_bytes = "16MB"
# Separate, tighter limits for tracked-point scans.
track_max_inodes = 1000000
track_max_edges = 2000000
track_max_depth = 1024
track_memory_budget = "256MB"
max_tracked_points = 128
# Ignored. Points come only from tracked_paths.
# `/` selects the global scan; other absolute paths are tracked points.
# Both this list and enabled can be changed with `cv admin config`
# (`master.dir_space_enabled`, `master.dir_space_tracked_paths`).
# Those runtime keys keep their historical spelling; the configuration paths
# they back are `master.dir_space.enabled` and `master.dir_space.tracked_paths`.
auto_track_mounts = false
tracked_paths = []
# How long a snapshot restore waits for an in-flight scan lease to drop.
# The RocksDB copy and tree rebuild are not bounded by this timeout.
restore_wait_timeout = "30s"

# Version compatibility policy.
# mode: "diagnose" (default, allow with warnings) or "enforce" (reject
# incompatible workers/clients). Bounds below are empty by default, meaning
# old components are never rejected without explicit configuration.
#
# NOTE: enforce mode requires workers that report component_info on their
# heartbeat (available since #1584). Workers built before #1584 do not send
# component_info, so every heartbeat resolves to MissingInfo and enforce mode
# rejects them - the cluster cannot form. Keep diagnose until the whole
# worker fleet is upgraded.
# [master.compatibility]
# mode = "diagnose"
# min_worker_version = "0.1.0"
# min_client_version = "0.1.0"
# blocked_versions = ["0.2.5"]

# Optional standalone stateless metadata service. Disabled by default; start it
# with `curvine-server --service mds` after enabling this flag.
[mds]
enabled = false
rpc_port = 8998
web_port = 9004
# KV storage backend. Supported values: "fdb" and "memory".
# Use "fdb" for production deployments; "memory" is only intended for tests
# and loses all metadata when the MDS process exits.
kv_backend = "fdb"
# Path to the FoundationDB cluster file (the same file `fdbcli -C <path>`
# accepts). Required when kv_backend = "fdb".
fdb_cluster_file = "/etc/foundationdb/fdb.cluster"
log = { level = "info", log_dir = "logs", file_name = "mds.log" }


# Standalone curvine-web admin console.
[web]
port = 9000

# Built-in observability is self-contained. To use Prometheus, change mode to
# "prometheus" or "auto", set the URL below, and apply the target labels shown
# in etc/prometheus-curvine.yml.
[web.observability]
enabled = true
mode = "builtin"
scrape_interval = "60s"
scrape_timeout = "3s"
retention = "24h"
max_concurrent_scrapes = 32
max_concurrent_dashboard_queries = 8
max_series = 100000
max_samples_per_series = 10000
# Upper bound on a single /metrics response body. A busy master emits per-client
# counters and can exceed 4 MiB; too small a cap marks a healthy target as down.
max_payload_bytes = 33554432

# FUSE metrics scraping is opt-in. When enabled with empty targets, the collector
# defaults to 127.0.0.1:{fuse.web_port}. Set explicit host:port values when
# curvine-web and curvine-fuse run on different hosts.
[web.observability.fuse]
enabled = false
targets = []

[web.observability.prometheus]
url = ""
query_timeout = "5s"
fallback_builtin = true
target_cache_ttl = "30s"


# masta ha raft configuration.
[journal]
journal_addrs = [
    {id = 1, hostname = "localhost", port = 8996}
]
journal_dir = "testing/journal"


# Worker configuration
[worker]
# Relative allocation weight used when master.worker_policy = "weighted".
# Set higher values on more capable nodes; 0 disables new allocations to this worker.
# This is trusted administrator configuration and is not capped by the master.
weight = 1
dir_reserved = "0"
# Strict physical free-space floor for Curvine write admission. The worker
# reports only bytes above this floor, so both new blocks and FileLayout rewrite
# staging copies are rejected if their full reservation would cross it. Existing
# committed data remains readable, but files on a low-space worker may be
# temporarily non-writable. This protects shared-device space for other apps.
#
# Rewrites do not bypass the floor: FileLayout keeps committed + staging copies
# concurrently, and an expanding rewrite reserves the full target block size
# (for example, rewriting a 10GB block with a 20GB target may need about 30GB at
# peak). 0.0 disables (default). Range [0.0, 1.0); 0.1 protects 10%.
# Another app can still consume space after the worker samples the device.
# free_ratio = 0.1
data_dir = [
    "[DISK]testing/data",
]
log = { level = "info", log_dir = "logs", file_name = "worker.log" }
enable_s3_gateway = false

# Storage health thresholds. A data dir is quarantined only after N consecutive
# probe failures and returns to service after M consecutive successes, so a
# transient EIO no longer disables a disk until the worker restarts.
[worker.health]
consecutive_failures = 3
consecutive_successes = 5

# SPDK over NVMe-oF/RDMA configuration  
[worker.spdk_disk]  
enabled = false  
app_name = "curvine"  
reactor_mask = "0x3"  
# Max time to wait for an idle NVMe qpair under qpair exhaustion (default "30s").  
# qpair_acquire_timeout = "30s"  


# NVMe-oF targets  
[[worker.spdk_disk.targets]]  
trtype = "rdma"  
adrfam = "ipv4"  
traddr = "192.168.1.100"  
trsvcid = 4420  
subnqn = "nqn.2024-01.io.curvine:subsystem1"  
[[worker.spdk_disk.targets]]  
trtype = "rdma"  
adrfam = "ipv4"  
traddr = "192.168.1.101"  
trsvcid = 4420  
subnqn = "nqn.2024-01.io.curvine:subsystem2"

# Customer service configuration.
[client]

[transfer]
# Set to true to start the standalone Transfer service. Local SQLite storage,
# replica metadata reader and localhost:9010 are inferred by default. Transfer
# uses its own RPC/Web ports and log file; it does not reuse Master settings.
# Production stores use store_url. TLS validates the system trust store; add
# sslrootcert for a PostgreSQL server signed by a private CA:
# store_url = "postgresql://user:password@postgres-host:5432/curvine_transfer?sslmode=require"
# store_url = "postgresql://user:password@postgres-host:5432/curvine_transfer?sslmode=require&sslrootcert=/etc/curvine/postgres-ca.pem"
#
# Multi-node / hostNetwork workers: do NOT leave hostname/endpoints on localhost.
# Transfer advertises endpoints to workers as progress report targets. With
# mysql/postgres store_url, loopback advertise addresses are rejected at startup.
# hostname = "curvine-transfer-0"
# endpoints = ["curvine-transfer-0:9010", "curvine-transfer-1:9010"]
# Or export CURVINE_TRANSFER_HOSTNAME / set hostname=0.0.0.0 with reachable endpoints.
enabled = false
rpc_port = 9010
web_port = 9011
# Maximum distinct auto-cache requests waiting for client-side submission.
# When full, new cache requests are skipped and foreground reads continue from UFS.
client_pending_queue_size = 1024
client_submit_concurrency = 64
# Upper bound on the tasks one Load/Export job may plan, default 500000.
# This bounds tasks, not files: a source file at or above the segment threshold
# is split into several tasks, so a few large files can exhaust the budget. A
# job whose plan exceeds this fails during planning with "files exceeds N".
# Raise it for very large partitions, or split the job into smaller sources.
# Also hot-updatable through the Transfer UpdateConfigs endpoint
# (POST /api/update_config with key max_tasks_per_transfer).
# max_tasks_per_transfer = 500000
# Upper bound on collected filesystem entries (files + directories) for one
# planning pass, default 500000. Collection dominates planning memory, so raise
# this for very wide partitions; a tree exceeding it fails during listing with
# "entries exceeds N" before the task cap is even consulted.
# Also hot-updatable through UpdateConfigs (key max_plan_entries).
# max_plan_entries = 500000
log = { level = "info", log_dir = "logs", file_name = "transfer.log" }

# fuse configuration
[fuse]
# Kernel-side metadata cache timeouts (`DurationUnit`: integer milliseconds
# or strings such as "1s" / "500ms"). The previous `*_ms` keys are still
# accepted as aliases. Bare integers are milliseconds, not seconds.
attr_timeout = "1s"       # kernel attribute cache; 0 disables it
entry_timeout = "1s"      # kernel dentry (name lookup) cache; 0 disables it
negative_timeout = 0      # negative-lookup (ENOENT) cache; 0 = disabled

# Route unlink/rmdir through the master's async delete lane: the name leaves the
# namespace immediately and the master reclaims the blocks in the background
# through /.Trash/.pending (see master.trash_purge_interval). Off by default
# because POSIX users expect the space to be free when the call returns. Mounted
# paths always stay synchronous.
# async_delete = false

# FUSE processes write their own file under logs/. Launch environments that
# collect the container stdout instead (for example CSI MountPods) can set
# log_dir = "stdout" for [fuse].
log = { level = "info", log_dir = "logs", file_name = "fuse.log" }

# The log configuration of the customer service side, and the customer service side of rust, java, and fuse use this log file.
[log]
level = "info"
log_dir = "logs"
file_name = "curvine.log"


# S3 Object Gateway configuration
[s3_gateway]
# Listen address for S3 gateway (host:port)
listen = "0.0.0.0:9900"
region = "us-east-1"
# Temporary directory for all PUT operations (multipart and regular)
put_temp_dir = "/tmp/curvine-temp"
# Memory buffer threshold for small files (bytes, default: 1MB)
put_memory_buffer_threshold = 1048576
# Maximum memory buffer size (bytes, default: 16MB)
put_max_memory_buffer = 16777216

# GET Performance Optimization Settings
# GET read/write chunk size in MB (default: 1.0, options: 0.5/1/2)
get_chunk_size_mb = 1.0

[cli]
log = { level = "warn", log_dir = "stdout", file_name = "cli.log" }
