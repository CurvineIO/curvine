<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif}.t{font-size:22px;font-weight:700;fill:#111827}.ll{font-size:13px;font-weight:700}.bt{font-size:14px;font-weight:600;fill:#111827}.bs{font-size:11px;fill:#6b7280}.al{font-size:11px;font-weight:600}.lg{font-size:11px;fill:#6b7280}</style>
<defs>
<marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
