[package]
name = "curvine-libsdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
name = "curvine_libsdk"

[features]
default = ["java-sdk"]
rust-sdk = ["curvine-sdk-core/rust-sdk"]
java-sdk = ["dep:curvine-libsdk-java"]
python-sdk = ["dep:curvine-libsdk-python", "curvine-libsdk-python/extension-module"]

# Explicit minimal SDK profiles. These only select the language binding and
# keep UFS/native storage adapters disabled unless a backend feature below is
# requested.
java-sdk-minimal = ["java-sdk"]
python-sdk-minimal = ["python-sdk"]

# Optional UFS release profiles. Public OpenDAL backends are opt-in; the
# OSS-HDFS/Jindo profile remains internal and explicit because it links native
# vendor libraries.
opendal-s3 = ["curvine-sdk-core/opendal-s3", "curvine-libsdk-java?/opendal-s3", "curvine-libsdk-python?/opendal-s3"]
opendal-oss = ["curvine-sdk-core/opendal-oss", "curvine-libsdk-java?/opendal-oss", "curvine-libsdk-python?/opendal-oss"]
opendal-gcs = ["curvine-sdk-core/opendal-gcs", "curvine-libsdk-java?/opendal-gcs", "curvine-libsdk-python?/opendal-gcs"]
opendal-azblob = ["curvine-sdk-core/opendal-azblob", "curvine-libsdk-java?/opendal-azblob", "curvine-libsdk-python?/opendal-azblob"]
opendal-cos = ["curvine-sdk-core/opendal-cos", "curvine-libsdk-java?/opendal-cos", "curvine-libsdk-python?/opendal-cos"]
opendal-webhdfs = ["curvine-sdk-core/opendal-webhdfs", "curvine-libsdk-java?/opendal-webhdfs", "curvine-libsdk-python?/opendal-webhdfs"]
opendal-hdfs = ["curvine-sdk-core/opendal-hdfs", "curvine-libsdk-java?/opendal-hdfs", "curvine-libsdk-python?/opendal-hdfs"]
opendal-hdfs-native = ["curvine-sdk-core/opendal-hdfs-native", "curvine-libsdk-java?/opendal-hdfs-native", "curvine-libsdk-python?/opendal-hdfs-native"]
internal-oss-hdfs-jindo = ["curvine-sdk-core/internal-oss-hdfs-jindo", "curvine-libsdk-java?/internal-oss-hdfs-jindo", "curvine-libsdk-python?/internal-oss-hdfs-jindo"]
oss-hdfs = ["internal-oss-hdfs-jindo"]

[dependencies]
curvine-sdk-core = { workspace = true }
curvine-libsdk-java = { workspace = true, optional = true }
curvine-libsdk-python = { workspace = true, optional = true }
