[package]
name = "curvine-tests"
version = "0.1.0"
description = "Curvine integration and regression test harness"
edition = "2021"
publish = false

# This package is an opt-in test harness, not a production crate. Its normal
# dependencies may include server/client/FUSE paths used by integration tests.

[features]
# Enable OSS-HDFS backend specific tests / code paths (Jindo-based).
# This is used by `#[cfg(feature = "oss-hdfs")]` in integration tests.
oss-hdfs = ["curvine-client/oss-hdfs"]
lancedb = [
    "dep:curvine-lancedb",
    "dep:lance-io",
    "dep:object_store",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:url",
]

[[test]]
name = "lancedb_object_store_e2e"
path = "tests/lancedb_object_store_e2e.rs"
required-features = ["lancedb"]

[dependencies]
orpc = { workspace = true }
curvine-common = { workspace = true }
curvine-server = { workspace = true }
curvine-client = { workspace = true, features = ["job-client", "unified", "opendal-s3"] }
curvine-lancedb = { workspace = true, optional = true }
curvine-ufs-api = { workspace = true }
tokio  = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
lance-io = { version = "4.0.0", default-features = false, optional = true }
object_store = { version = "0.12.5", optional = true }
bytes = { workspace = true }
once_cell = { workspace = true }
clap = { workspace = true }
arrow-array = { version = "57.2", optional = true }
arrow-schema = { version = "57.2", optional = true }
awaitility = "0.4"
tempfile = { workspace = true }
url = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
curvine-fuse = { workspace = true }
